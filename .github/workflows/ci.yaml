name: push_ci
run-name: Push CI
on:
  workflow_dispatch:
  push:
    branches:
      - master
jobs:
  test:
    strategy:
      matrix:
        arch: [x86_64]
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    runs-on: ${{matrix.os}}
    steps:
      - uses: actions/checkout@v3
      - run: |
          zig version
