name: push_ci
run-name: Push CI
on:
  workflow_dispatch:
  push:
    branches:
      - master
jobs:
  macos:
    runs-on: [self-hosted, macOS, ARM64]
    env: 
      BUILD_REASON: "PullRequest"
      ARCH: "x86_64"
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Run macOS Build Script
        run: ./ci/azure/macos_script

      - run: |
          zig version
